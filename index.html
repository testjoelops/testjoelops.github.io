<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staardust</title>
</head>
  
<body>
    <main>
        <section>
            <p>Welcome to</p>
            <h1>Staardust</h1>
            <p>
                A place to explore ideas, build projects, and create meaningful
                experiences. This is just the beginning of a journey through
                technology, creativity, and continuous learning.
            </p>
        </section>
        <section>
            <h2>Stay Updated</h2>
            <p>
                Subscribe to receive updates whenever new content is published.
            </p>
            <form>
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
                <button type="submit">
                    Subscribe
                </button>
            </form>
        </section>
    </main>
</body>

</html>
